<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starbucks Philippines — Espresso Lab</title><link rel="stylesheet" href="style.css"></head><body>
<div class="shell">
<header><div class="brand">STARBUCKS® <span>ESPRESSO LAB</span></div><div class="status"><i></i><span id="status">MACHINE READY</span></div><a href="https://dariakimberly4-netizen.github.io/interactive-drink-menu/starbucks-menu-orbit/v89.html?refresh=94#orbit">FULL MENU ↗</a></header>
<main>
<section id="machine" class="machine">
<div class="machine-top"><div class="gauge"><div class="ticks"></div><div id="needle" class="needle"></div><b>PRESSURE</b></div><div class="display"><small>SELECT EXTRACTION</small><strong id="display">READY</strong><div class="timer"><span id="timer">00.0</span> SEC</div></div><div class="beans-window"><div class="beans"></div><span>ESPRESSO ROAST</span></div></div>
<div class="selector"><button data-shot="RISTRETTO">RISTRETTO<small>SHORT</small></button><button class="selected" data-shot="ESPRESSO">ESPRESSO<small>CLASSIC</small></button><button data-shot="DOPPIO">DOPPIO<small>DOUBLE</small></button></div>
<div class="brew-zone"><div class="grouphead"><div class="handle"></div><div class="spout s1"></div><div class="spout s2"></div></div><div class="streams"><i></i><i></i></div><div class="lab-cup"><div class="cup-inner"><div class="liquid"></div><div class="crema"></div></div><span>STARBUCKS®<br>ESPRESSO</span></div><div class="driptray"></div></div>
<button id="brew" class="brew"><span>●</span> START EXTRACTION</button>
</section>
<section id="lab" class="lab hidden">
<div class="lab-head"><div><small>EXPERIMENT 02</small><h1>BUILD YOUR<br>ESPRESSO.</h1></div><div class="recipe-no"><span id="recipeNo">01</span>/05</div></div>
<div class="recipe-stage" id="stage">
<button id="prev" class="arrow">←</button>
<div class="recipe-glass"><div id="ice" class="ice"></div><div id="coffee" class="coffee"></div><div id="milk" class="milk"></div><div id="foam" class="foam"></div><div class="mark">STARBUCKS®</div></div>
<div class="recipe-copy"><small id="type">ESPRESSO + WATER</small><h2 id="drink">AMERICANO</h2><p id="desc">Bold espresso extended with water for a clean, intense cup.</p><div class="formula"><span id="f1">ESPRESSO</span><i></i><span id="f2">WATER</span></div></div>
<button id="next" class="arrow">→</button>
</div>
<div class="recipe-nav" id="recipeNav"></div>
</section>
</main>
<div id="hotspots" class="hotspots"><button data-info="bean">BEAN</button><button data-info="roast">ROAST</button><button data-info="craft">CRAFT</button><button data-info="ph">PHILIPPINES</button></div>
<div id="drawer" class="drawer"><button id="close">×</button><small id="drawerTag"></small><h2 id="drawerTitle"></h2><p id="drawerText"></p></div>
</div><script src="script.js"></script></body></html>
